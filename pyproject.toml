[project]
name = "news-aggregator"
version = "0.1.0"
description = "CLI tool to fetch and summarize news from RSS feeds for AI and Cricket topics"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anoop Kumar" }]
requires-python = ">=3.12"
dependencies = [
    "feedparser==6.0.12",
    "openai==2.41.0",
    "click==8.4.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "nh3==0.3.5",
    "python-dateutil==2.9.0.post0",
]

[project.urls]
Repository = "https://github.com/anoopk-personal/news-aggregator"

[project.scripts]
get-news = "src.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.16",
    "mypy==2.1.0",
    "types-python-dateutil==2.9.0.20260518",
    "pip-audit==2.10.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
