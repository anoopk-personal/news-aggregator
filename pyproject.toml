[project]
name = "news-aggregator"
version = "0.1.0"
description = "CLI tool to fetch and summarize news from RSS feeds for AI and Cricket topics"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anoop Kumar" }]
requires-python = ">=3.12"
dependencies = [
    "feedparser==6.0.11",
    "openai==1.59.9",
    "click==8.1.8",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "bleach==6.1.0",
    "python-dateutil==2.9.0",
]

[project.urls]
Repository = "https://github.com/anoopk-personal/news-aggregator"

[project.scripts]
get-news = "src.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "S", "B"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
