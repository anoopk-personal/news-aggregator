# Feed configuration for the news aggregator.
# Add new topics by creating a [topics.<name>] section with a feeds list.
# Optional: set line_limits = [min, max] for LLM summarization length.

[topics.ai]
feeds = [
    "https://news.mit.edu/rss/topic/artificial-intelligence2",
    "https://bair.berkeley.edu/blog/feed.xml",
    "https://openai.com/blog/rss.xml",
    "https://blog.google/technology/ai/rss/",
    "https://huggingface.co/blog/feed.xml",
    "https://thegradient.pub/rss/",
    "https://www.marktechpost.com/feed/",
    "https://syncedreview.com/feed/",
    "https://www.artificialintelligence-news.com/feed/",
    "https://venturebeat.com/category/ai/feed/",
    "https://techcrunch.com/category/artificial-intelligence/feed/",
    "https://www.wired.com/feed/tag/ai/latest/rss",
    "https://feeds.arstechnica.com/arstechnica/technology-lab",
    "https://feed.infoq.com/ai-ml-data-eng/",
    "https://thenewstack.io/ai/feed/",
    "https://pub.towardsai.net/feed",
    "https://www.kdnuggets.com/feed",
    "https://machinelearningmastery.com/feed/",
]
line_limits = [100, 200]

[topics.cricket]
feeds = [
    "https://www.espncricinfo.com/rss/content/story/feeds/0.xml",
    "https://feeds.bbci.co.uk/sport/cricket/rss.xml",
    "https://cricketweb.net/feed",
]
line_limits = [20, 50]
