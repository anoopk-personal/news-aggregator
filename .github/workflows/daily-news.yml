name: Daily News

on:
  schedule:
    # 11:00 UTC daily (6 AM CDT / 5 AM CST)
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Generate news
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          NEWS_TOPIC: all
        run: uv run get-news --topic "$NEWS_TOPIC"

      - name: Update dashboard
        run: uv run python -m src.dashboard

      - name: Create PR with news
        env:
          # PAT_TOKEN required: GITHUB_TOKEN-created PRs don't trigger other workflows,
          # so the required lint-and-test check never runs.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="daily-news/${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f daily-news/
          git add metrics/
          git add README.md
          if git diff --staged --quiet; then
            echo "No news files generated"
            exit 0
          fi

          # Check if branch exists remotely and delete it (for re-runs on same day)
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH exists, deleting for re-run..."
            git push origin --delete "$BRANCH" || true
          fi

          git checkout -b "$BRANCH"
          git commit -m "chore: daily news ${DATE}"
          git push -u origin "$BRANCH"

          # Create PR if one doesn't already exist for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            if ! gh pr create --base dev \
                --title "chore: daily news ${DATE}" \
                --body "Automated daily news generation for ${DATE}"; then
              echo "::error::Failed to create PR for ${DATE}"
              exit 1
            fi
          else
            echo "PR #${EXISTING_PR} already exists for this branch"
          fi

      - name: Cleanup branch on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="daily-news/${DATE}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Cleaning up orphaned branch ${BRANCH}..."
            git push origin --delete "$BRANCH" || true
          fi
