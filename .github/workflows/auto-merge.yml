name: Auto Merge and Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # Only enable auto-merge for feature branches (not daily-news which has its own workflow)
    if: |
      github.event.pull_request.base.ref == 'dev' &&
      !startsWith(github.event.pull_request.head.ref, 'daily-news/')

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Enabling auto-merge for PR #${{ github.event.pull_request.number }}"
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --auto \
            --squash \
            --delete-branch
